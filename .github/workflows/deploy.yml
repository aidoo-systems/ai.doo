  name: Deploy to VPS

  on:
    push:
      branches: [main]

  jobs:
    deploy:
      runs-on: ubuntu-latest
      environment: VPS
      steps:
        - uses: actions/checkout@v4

        - name: Fetch PIKA changelog
          run: |
            curl -sf -H "Authorization: token ${{ secrets.PIKA_REPO_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/aidoo-systems/pika/contents/CHANGELOG.md" \
              -o CHANGELOG.md

        - name: Build changelog page
          run: python build-changelog.py --changelog CHANGELOG.md

        - name: Build docs site
          run: |
            pip install mkdocs-material
            mkdocs build -f mkdocs.yml -d _docs_build

        - name: Set up SSH
          env:
            SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          run: |
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

        - name: Deploy main site via rsync
          run: |
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/deploy_key" \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.claude' \
              --exclude='README.md' \
              --exclude='CLAUDE.md' \
              --exclude='AGENTS.md' \
              --exclude='scripts/' \
              --exclude='ruff.toml' \
              --exclude='.gitattributes' \
              --exclude='tests/' \
              --exclude='internal/' \
              --exclude='logo_designs.png' \
              --exclude='build-changelog.py' \
              --exclude='CHANGELOG.md' \
              --exclude='nul' \
              --exclude='api/' \
              --exclude='docs/' \
              --exclude='mkdocs.yml' \
              --exclude='overrides/' \
              --exclude='_docs_build/' \
              ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/aidoo.biz/

        - name: Deploy docs site via rsync
          run: |
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/deploy_key" \
              _docs_build/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/docs.aidoo.biz/

    deploy-api:
      needs: deploy
      runs-on: ubuntu-latest
      environment: VPS
      steps:
        - uses: actions/checkout@v4

        - name: Deploy API to VPS
          env:
            SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          run: |
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

            rsync -avz \
              -e "ssh -i ~/.ssh/deploy_key" \
              api/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/aidoo-api/

        - name: Install dependencies and restart service
          env:
            SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          run: |
            ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "/opt/aidoo-api/venv/bin/pip install -q -r /opt/aidoo-api/requirements.txt && sudo systemctl restart aidoo-api"

    # rsync --delete never removes an excluded path from the server, so a file served before it was
    # excluded stays served. Its own job, so a failure here never holds up the docs or API deploys.
    check-served:
      needs: deploy
      runs-on: ubuntu-latest
      steps:
        - name: Check nothing internal is served
          run: |
            fail=0
            for path in .git/HEAD .git/config CLAUDE.md AGENTS.md internal/email-templates/welcome.md scripts/gates.sh docs/CURRENT_SPRINT.md; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://aidoo.biz/$path")
              echo "$path $code"
              if [ "$code" = "200" ]; then fail=1; fi
            done
            if [ "$fail" = "1" ]; then echo "::error::internal files are publicly served at aidoo.biz"; exit 1; fi
