name: Gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the docs gate compares sprint dates with git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the VPS runs python3.12 (README, VPS setup)
      # Same tools deploy uses, plus the gate tooling. ruff is pinned so a new
      # release can't change what the format gate expects (rules are in ruff.toml);
      # The docs build is pinned in scripts/docs-requirements.txt; deploy installs the same file.
      - run: python -m pip install -r api/requirements.txt -r scripts/docs-requirements.txt pytest "ruff==0.15.9" pip-audit
      - run: bash scripts/gates.sh # same definition as the desk
